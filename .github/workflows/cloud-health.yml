name: Cloud vocabulary health

on:
  schedule:
    # Wake daily; the cadence step allows a database check every six days.
    # A day-of-month expression such as */6 would reset at month boundaries.
    - cron: '23 8 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/cloud-health.yml
      - scripts/check_cloud.py
      - docs/config.js

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'jizhang02/Vocabulary-in-Compurter-Science-Paper'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check six-day cadence
        id: cadence
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import date, datetime, timezone

          today = datetime.now(timezone.utc).date()
          days = (today - date(2026, 10, 6)).days
          due = os.environ['EVENT_NAME'] != 'schedule' or (days >= 0 and days % 6 == 0)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"due={str(due).lower()}\n")
          print(f"UTC date: {today}; database check due: {due}")
          PY
      - uses: actions/checkout@v4
        if: steps.cadence.outputs.due == 'true'
      - name: Read a public vocabulary entry
        if: steps.cadence.outputs.due == 'true'
        run: python3 scripts/check_cloud.py
